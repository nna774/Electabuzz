<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Electabuzz — 系統周波数モニタ</title>
  <style>
    :root { color-scheme: light dark; --fg: #222; --bg: #fafafa; --line: #ccc; --accent: #2a6fdb;
      --nominal: #999; --predict: #d4a017; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ddd; --bg: #1a1a1a; --line: #444;
      --nominal: #888; --predict: #e0b52c; } }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; color: var(--fg); background: var(--bg); }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { font-size: 16px; margin: 0; }
    main { padding: 16px; max-width: 1000px; margin: 0 auto; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    select, input, button { font-size: 14px; padding: 6px 8px; }
    canvas { width: 100%; height: 280px; border: 1px solid var(--line); background: var(--bg); display: block; }
    .muted { color: #888; font-size: 12px; }
    .status-line { min-height: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 0 8px; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .badge-nominal { background: #888; color: #fff; }
    .badge-ntp { background: #d4a017; color: #fff; }
    .badge-pps { background: #2e9b57; color: #fff; }
    .status-ok { color: #2e9b57; font-weight: 600; }
    .status-ng { color: #c0392b; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
    td:first-child { color: #888; width: 40%; white-space: nowrap; }
    #api-settings { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Electabuzz — 系統周波数モニタ</h1>
    <span style="flex:1"></span>
    <span id="api-settings">
      <input id="api" size="34" placeholder="API URL (Function URL)">
      <button id="save-api">保存</button>
    </span>
  </header>

  <main>
    <div class="row">
      <label>表示範囲:
        <select id="minutes">
          <option value="1">1分</option>
          <option value="5" selected>5分</option>
          <option value="15">15分</option>
          <option value="30">30分</option>
        </select>
      </label>
      <label><input type="checkbox" id="autorefresh" checked> 自動更新</label>
      <button id="refresh-now" title="自動更新オフの時に手動で更新する">更新</button>
      <label title="巻数比は暫定値かつAFE換算も1点校正のみ。参考程度に留めること">
        <input type="checkbox" id="show-wall-voltage"> 壁側電圧を概算表示(巻数比10.08倍・未確定)
      </label>
    </div>
    <div id="status" class="muted status-line"></div>
    <canvas id="freq-canvas"></canvas>
    <p class="muted">縦軸: 系統周波数[Hz]。灰色の破線は公称値(50/60Hz)。データが途切れている区間は
      線をつながない（PPS未着のためGNSS品質ではなくNTP品質。時刻偏差の絶対値はまだ出せない）。
      起動直後〜NTP規正(約10分)までは
      <span style="color:var(--nominal)">点線(未規正・生の値)</span>で描き、規正が済むと
      <span style="color:var(--predict)">アンバーの破線(事後補正した予測値)</span>
      がその区間へ遡って重なる。</p>

    <table id="quality-table">
      <tbody></tbody>
    </table>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
