; Electabuzz ファームウェア
; 母艦: ESP32-S3-WROOM-1 **N16R8**（16MB QD flash + 8MB OT PSRAM）の DevKitC-1 系クローン
[platformio]
default_envs = s3

[env:s3]
; **版で pin する。ブランチ追従にするな。** batch-uplink と同じ理由だ（→ docs/batch-uplink.md）。
; 7.0.1 は Arduino core 2.0.x / IDF 4.4 で、**I2S はレガシーの driver/i2s.h しかない**。
; core 3.x（IDF 5）は driver/i2s_std.h の別 API に移行しており、src/main.cpp は通らない。
; 上げるときは I2S の書き直しとセットでやること。黙って上がる状態にしておくな。
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
; クローンボードのUSB-シリアル変換は高速だと化けるので落とす（Namazu で踏んだ）。
monitor_speed = 115200
upload_speed = 460800

; --- N16R8 への差分 ---
; 既定の board 定義は DevKitC-1-**N8**（8MB・PSRAM無し）なので 16MB を教える。
; 教えないとパーティション表が 8MB のまま作られ、後半 8MB が死ぬ。
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; **PSRAM は意図的に有効化しない。**
;   (1) 要らない。1バッチ 424B で、Goertzel の状態も数十バイトだ
;   (2) I2S の DMA バッファは内蔵 SRAM に置く必要がある。有効にしても速くも大きくも
;       ならず、置き場所を間違える余地が増えるだけ
; 有効にするなら board_build.arduino.memory_type = qio_opi が要る（R8 は octal PSRAM
; なので既定の qio_qspi では起動しない）。**必要になってから足せ。**
;
; ただし **有効化の有無に関わらず GPIO 33〜37 は使えない。** モジュール内部で
; octal PSRAM のダイに配線されている。ピンヘッダには出ていて気付かず刺せてしまうので、
; I2S のピン割り当てでここを踏むな。

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
build_unflags =
    -std=gnu++11

lib_deps =
    ; 送信基盤(Batch/Uploader/TimeSync)。地震計 Namazu と共有する。
    ; **必ずタグで pin すること。** #master にすると、向こうのために入れた変更が
    ; こちらの次回ビルドで黙って混入し、「何も変えていないのに壊れる」ことになる。
    ; → docs/batch-uplink.md
    https://github.com/nna774/batch-uplink.git#v1.6.0

; DevKitC-1 系は USB-C が2つある。既定（上の env）は UART ブリッジ側の
; ポート（"COM"）に Serial が出る。ネイティブUSB側（"USB"）に挿すならこちら:
;   pio run -e s3-usbcdc -t upload && pio device monitor -e s3-usbcdc
[env:s3-usbcdc]
extends = env:s3
build_flags =
    ${env:s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; フェーズ1の疎通確認用（WiFi/NTP/fs回帰なし、I2S生サンプルをシリアルに吐くだけ）。
; Namazuの NAMZ_SENSOR_TEST と同じ位置付け（→ docs/roadmap.md）:
;   pio run -e gridfreqtest -t upload && python tools/capture_serial.py --port <port> --seconds 30 > cap.csv
[env:gridfreqtest]
extends = env:s3
build_flags =
    ${env:s3.build_flags}
    -DNAMZ_GRIDFREQ_TEST=1

; フェーズ2(PPS)を待たずに実測・記録・送信を始めるモード。timebase_source は
; 正直にNTP品質(NtpTimebase)と申告する。secrets.h の kDeviceId/kIngestUrl/
; kHmacSecret を埋めてから使うこと（→ docs/log/2026-08-07-goertzel-cpp-port.md）。
;   pio run -e record -t upload && pio device monitor -e record
[env:record]
extends = env:s3
build_flags =
    ${env:s3.build_flags}
    -DNAMZ_GRIDFREQ_RECORD=1
